.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map{position:absolute;left:0;top:0;width:1400px;height:788px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.routes{position:absolute;left:0;top:0;width:1400px;height:788px;overflow:visible;pointer-events:none}
.route-done{stroke:#7d7b77;stroke-width:6;stroke-linecap:round;fill:none;opacity:.9}
.route-live{stroke:#e1ad36;stroke-width:7;stroke-linecap:round;fill:none;stroke-dasharray:12 14;animation:dash 1.2s linear infinite;filter:drop-shadow(0 0 5px rgba(255,210,87,.7))}
@keyframes dash{to{stroke-dashoffset:-26}}
.marker{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 7px 18px rgba(0,0,0,.32);color:#1c1309}
.marker.done{width:56px;height:56px;background:linear-gradient(#bcbab4,#7f7d78);filter:grayscale(1)}
.marker.current{width:76px;height:76px;background:linear-gradient(#ffe885,#e4ad32);border:5px solid rgba(255,249,227,.95);animation:pulse 1.8s ease-in-out infinite}
.marker .ico{font-size:28px}.marker.current .ico{font-size:35px}
.marker .you{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:rgba(66,44,22,.94);color:#fff5db;border-radius:999px;padding:6px 12px;font-weight:bold;font-size:12px;white-space:nowrap;letter-spacing:.05em}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 8px rgba(236,189,72,.15),0 0 34px rgba(236,189,72,.72),0 8px 18px rgba(0,0,0,.3)}}
.topbar{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;z-index:15;display:flex;justify-content:space-between;pointer-events:none}
.pill{pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(65,43,21,.82);backdrop-filter:blur(12px);color:#fff6df;border-radius:999px;padding:9px 13px;font-size:12px;box-shadow:0 5px 15px rgba(0,0,0,.23)}
.pill.test{background:rgba(42,74,111,.9)}
.bottomAction{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:14;border:0;border-radius:999px;background:rgba(63,42,21,.9);color:#fff6df;padding:12px 18px;font-weight:bold;box-shadow:0 7px 22px rgba(0,0,0,.3);display:none;max-width:88vw}
.bottomAction.nextGlow{background:linear-gradient(#ffe889,#dfa72d);color:#3c2914;font-size:17px;padding:14px 28px;box-shadow:0 0 0 5px rgba(255,229,144,.2),0 0 30px rgba(247,194,66,.9),0 9px 28px rgba(0,0,0,.34);animation:nextPulse 1.45s ease-in-out infinite}
@keyframes nextPulse{50%{transform:translateX(-50%) scale(1.06)}}
.completionBanner{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);z-index:14;display:none;background:rgba(61,43,24,.92);color:#fff4d2;border:1px solid rgba(255,230,154,.6);border-radius:18px;padding:13px 18px;text-align:center;font-weight:bold;box-shadow:0 8px 25px rgba(0,0,0,.34);backdrop-filter:blur(8px);min-width:min(320px,82vw)}
.completionBanner.show{display:block;animation:bannerIn .35s ease-out}
.completionBanner small{display:block;font-weight:normal;opacity:.85;margin-top:4px}
@keyframes bannerIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.sheetWrap{position:fixed;inset:0;z-index:30;background:rgba(22,14,7,.56);display:none;align-items:flex-end;justify-content:center;padding-top:48px}
.sheetWrap.open{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:linear-gradient(#fbf1d7,#edd7a7);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);padding:19px 17px calc(22px + env(safe-area-inset-bottom))}
.handle{width:48px;height:5px;border-radius:5px;background:rgba(75,50,24,.22);margin:0 auto 14px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#8a672f;font-weight:bold}
h2{font-size:28px;margin:6px 0 12px}.card{background:rgba(255,255,255,.34);border:1px solid rgba(88,58,26,.14);border-radius:15px;padding:13px;margin:11px 0;line-height:1.52;white-space:pre-line}
.card.riddle{border-color:rgba(187,134,29,.42);background:rgba(255,247,218,.62)}.card.hint{background:#e5c880;display:none}.card.testnote{background:#dbe8f4;border-color:#9db5cb;font-size:13px;display:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:bold;cursor:pointer;background:#e4d0a5;color:#3e2a16}.btn.primary{background:linear-gradient(#f9dc75,#dca331)}.btn.dark{background:#5b4023;color:#fff5df}.btn.test{background:#315d87;color:white}.btn:disabled{opacity:.42;cursor:not-allowed}
.photoBox{background:rgba(255,255,255,.28);border:1px dashed rgba(83,55,25,.33);border-radius:15px;padding:12px;margin:12px 0}.photoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.photoItem{background:rgba(255,255,255,.4);border-radius:12px;padding:8px}.photoItem img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px}.photoItem input{width:100%;margin-top:7px;border:1px solid #bea777;border-radius:9px;padding:8px;background:#fff9e9}.small{font-size:12px;color:#745d40;line-height:1.4}.textInput{width:100%;min-height:88px;border:1px solid #bda576;border-radius:12px;padding:11px;background:#fff9e8;resize:vertical}.error{font-size:13px;color:#9a2f24;margin-top:7px;display:none}
.checks label{display:flex;gap:9px;align-items:flex-start;padding:9px 0}.checks input{width:20px;height:20px}
.finalExport{background:#e9cf8e;border:1px solid #c79d45;border-radius:15px;padding:13px;margin-top:13px}
@media(min-width:760px){.sheet{border-radius:24px;margin-bottom:20px;max-height:88vh}.sheetWrap{align-items:center;padding:20px}.photoGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

.handle{background:rgba(83,56,28,.26)!important;width:70px!important;height:8px!important}
.eyebrow{
  font-family:"Cormorant Garamond",Georgia,serif!important;
  font-size:14px!important;
  color:#7b5730!important;
  letter-spacing:.18em!important;
  margin:6px 2px 4px!important;
}
h2{
  font-family:"Cormorant Garamond",Georgia,serif!important;
  font-weight:600!important;
  font-size:36px!important;
  color:#2d1a0d!important;
  margin:4px 0 12px!important;
}
#sheetBody{margin-top:8px!important}
.card{
  font-family:"Cormorant Garamond",Georgia,serif!important;
  font-size:21px!important;
  line-height:1.44!important;
  color:#2f1d10!important;
  background:rgba(255,249,231,.38)!important;
  border:1px solid rgba(123,85,42,.22)!important;
  border-radius:18px!important;
  padding:18px 18px!important;
  margin:12px 0!important;
}
.card strong{font-family:"Neucha",Georgia,serif!important;font-size:20px!important}
.card.riddle{
  background:rgba(255,247,223,.52)!important;
  border:2px solid rgba(174,131,71,.44)!important;
  box-shadow:inset 0 0 0 2px rgba(255,248,233,.30)!important;
}
.card.hint{background:#ead5a8!important;border-color:#bb9052!important}
.btnrow{display:flex!important;flex-direction:column!important;gap:10px!important;flex-wrap:nowrap!important;margin-top:14px!important}
.btn{
  width:100%!important;
  display:flex!important;align-items:center!important;justify-content:space-between!important;
  gap:12px!important;
  border-radius:15px!important;
  padding:14px 18px!important;
  font-family:"Cormorant Garamond",Georgia,serif!important;
  font-size:21px!important;font-weight:600!important;
  background:linear-gradient(#f0dfba,#e0c38b)!important;
  color:#2f1d10!important;
  border:1px solid rgba(125,84,39,.48)!important;
  box-shadow:0 3px 10px rgba(67,42,19,.14), inset 0 1px rgba(255,255,255,.52)!important;
}
.btn::after{content:"›";font-size:28px;line-height:1;color:#5a3a1f;opacity:.95}
.btn.primary{background:linear-gradient(#edd7a5,#d7ae66)!important;box-shadow:0 0 0 2px rgba(255,233,185,.28),0 5px 14px rgba(76,45,15,.22)!important}
.btn.dark,.btn.test{background:linear-gradient(#ead8b1,#dbc38e)!important;color:#2f1d10!important}
.btn:disabled{opacity:.48!important}
.textInput,.photoItem input{font-family:"Neucha",Georgia,serif!important;font-size:18px!important;background:#faeed6!important;border-color:#bb9661!important}
.small{font-family:"Neucha",Georgia,serif!important;font-size:15px!important;color:#6a4f32!important}
.completionBanner{
  font-family:"Cormorant Garamond",Georgia,serif!important;
  font-size:18px!important;
  background:rgba(67,40,20,.95)!important;
  border:1px solid rgba(212,155,76,.72)!important;
  color:#f6e9cf!important;
  border-radius:22px!important;
}
.completionBanner small{font-family:"Neucha",Georgia,serif!important;font-size:15px!important}
.bottomAction{
  font-family:"Cormorant Garamond",Georgia,serif!important;
  font-size:24px!important;
  background:rgba(67,40,20,.95)!important;
  color:#f6e9cf!important;
  border:1px solid rgba(201,147,71,.68)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.36), inset 0 0 18px rgba(220,160,80,.07)!important;
}
.bottomAction.nextGlow{background:linear-gradient(#f0dfb8,#e1c37f)!important;color:#2e1b10!important}
.photoBox,.finalExport{background:rgba(255,248,229,.34)!important;border-color:rgba(123,84,43,.30)!important}
.marker.current{background:linear-gradient(#f8d674,#c28a2c)!important;box-shadow:0 0 0 7px rgba(241,187,76,.14),0 0 32px rgba(249,184,59,.70),0 7px 18px rgba(0,0,0,.42)!important}
.marker .you{font-family:"Cormorant Garamond",Georgia,serif!important;background:rgba(46,28,16,.96)!important;color:#f6e9cf!important}
@media(min-width:760px){.sheet{border-radius:24px!important;margin-bottom:20px!important;max-height:88vh!important}.sheetWrap{align-items:center!important;padding:20px!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="content.js"></script>
<script>
const STEPS=window.QUEST_STEPS||[];
const CFG=window.QUEST_SETTINGS||{};
const IW=1400,IH=788,KEY='anniversaryQuestTestV12';
let state=loadState();
let tx=0,ty=0,scale=1,drag=false,lastX=0,lastY=0,moved=false;
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),routes=document.getElementById('routes'),markers=document.getElementById('markers');
const sheetWrap=document.getElementById('sheetWrap'),sheetBody=document.getElementById('sheetBody'),sheetActions=document.getElementById('sheetActions'),sheetTitle=document.getElementById('sheetTitle'),eyebrow=document.getElementById('eyebrow');
const bottomAction=document.getElementById('bottomAction');
const completionBanner=document.getElementById('completionBanner');

function defaultState(){return{step:0,phase:'stage',completed:[],hintShown:{},hamsterTreat:false}}
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY))||defaultState();
    if(s.phase==='ready') s.phase='completed';
    return s;
  }catch(e){return defaultState()}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function normalize(s=''){
  return s
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[’ʼ`]/g,"'")
    .replace(/[.,!?;:«»"'’ʼ`()\[\]{}—–\-…]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function layout(initial=false){
  const vw=innerWidth,vh=innerHeight;
  const cover=Math.max(vw/IW,vh/IH);
  scale=Math.max(cover*1.22,.72);
  if(initial) centerOnCurrent(false);
  applyTransform(); renderMap();
}
function applyTransform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function point(step){return{x:step.x/100*IW,y:step.y/100*IH}}
function centerOnCurrent(anim=true){
  const s=STEPS[state.step]||STEPS[0],p=point(s);
  tx=innerWidth/2-p.x*scale; ty=innerHeight/2-p.y*scale;
  clamp(); if(anim)world.style.transition='transform .45s ease';applyTransform();setTimeout(()=>world.style.transition='',500)
}
function clamp(){
  const w=IW*scale,h=IH*scale;
  const margin=80;
  tx=Math.min(margin,Math.max(innerWidth-w-margin,tx));
  ty=Math.min(margin,Math.max(innerHeight-h-margin,ty));
}
viewport.addEventListener('pointerdown',e=>{drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;tx+=dx;ty+=dy;lastX=e.clientX;lastY=e.clientY;clamp();applyTransform()});
viewport.addEventListener('pointerup',()=>drag=false);
viewport.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',()=>layout(false));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>layout(false));

function renderMap(){
  markers.innerHTML='';routes.innerHTML='';
  // Completed segments only between visited points.
  for(let i=0;i<state.step;i++){
    if(!state.completed.includes(i)) continue;
    const a=point(STEPS[i]),b=point(STEPS[i+1]);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);
    line.setAttribute('class',state.phase==='stage'&&i===state.step-1?'route-live':'route-done');routes.appendChild(line);
  }
  for(let i=0;i<=state.step;i++){
    const s=STEPS[i],p=point(s),isDone=state.completed.includes(i),isCurrent=i===state.step&&state.phase==='stage'&&!isDone;
    if(i===state.step && state.phase!=='stage' && !isDone) continue;
    const b=document.createElement('button');b.className='marker '+(isCurrent?'current':'done');b.style.left=p.x+'px';b.style.top=p.y+'px';
    b.innerHTML=`<span class="ico">${s.icon}</span>${isCurrent?'<span class="you">МИ ТУТ</span>':''}`;
    b.onclick=()=>{if(!moved)openStage(i)};markers.appendChild(b);
  }
  updateBottomAction();
}
function updateBottomAction(){
  bottomAction.style.display='none';
  bottomAction.classList.remove('nextGlow');
  bottomAction.onclick=null;
  completionBanner.classList.remove('show');

  if(state.phase==='completed'){
    completionBanner.classList.add('show');
    bottomAction.textContent='ДАЛІ →';
    bottomAction.classList.add('nextGlow');
    bottomAction.style.display='block';
    bottomAction.onclick=advanceAfterCompletion;
  } else if(state.phase==='riddle'){
    bottomAction.textContent='🧭 Відкрити загадку';
    bottomAction.style.display='block';
    bottomAction.onclick=openRiddle;
  }
}
document.getElementById('centerBtn').onclick=()=>centerOnCurrent(true);
document.getElementById('resetBtn').style.display=CFG.testMode?'block':'none';
document.getElementById('resetBtn').onclick=async()=>{
  if(!confirm('Скинути весь тестовий маршрут і фото до початку?'))return;
  state=defaultState();localStorage.removeItem(KEY);await clearPhotos();renderMap();centerOnCurrent(true);openStage(0);
};

function openSheet(title,sub,html,actions=[]){
  sheetTitle.textContent=title;eyebrow.textContent=sub;sheetBody.innerHTML=html;sheetActions.innerHTML='';
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.kind||'');b.textContent=a.label;b.disabled=!!a.disabled;b.onclick=a.onClick;sheetActions.appendChild(b)});
  sheetWrap.classList.add('open');
}
function closeSheet(){sheetWrap.classList.remove('open')}
sheetWrap.addEventListener('click',e=>{if(e.target===sheetWrap)closeSheet()});

async function openStage(i){
  const s=STEPS[i];
  if(i<state.step || state.completed.includes(i)){
    openSheet(s.title,`Етап ${s.number}`,`<div class="card">${esc(s.intro||'')}</div><div class="card"><strong>Завдання</strong>\n${esc(s.task||'')}</div>`,[{label:'Закрити',onClick:closeSheet}]);return;
  }
  if(i!==state.step||state.phase!=='stage')return;
  let body=`${s.intro?`<div class="card">${esc(s.intro)}</div>`:''}${s.task?`<div class="card"><strong>Завдання</strong>\n${esc(s.task)}</div>`:''}`;
  if(s.completionType==='photo'||s.completionType==='photo_caption'){
    body+=`<div class="photoBox"><strong>Фото етапу</strong><div class="small">${esc(s.photoHelp||'')}</div><input id="photoInput" type="file" accept="image/*" capture="environment" multiple><div class="photoGrid" id="photoGrid"></div></div>`;
  }
  if(s.completionType==='phrase'){
    body+=`<div class="card"><strong>Введіть складену фразу</strong><textarea id="phraseInput" class="textInput" placeholder="Введіть фразу повністю…"></textarea><div class="error" id="phraseErr">Фраза поки не збігається. Перевірте слова й спробуйте ще.</div></div>`;
  }
  if(s.completionType==='hamster'){
    body+=`<div class="card checks"><strong>Хранитель перевіряє:</strong>
      <label><input type="checkbox" id="hutCheck"> Побудували халабуду й обоє залізли всередину</label>
      <label><input type="checkbox" id="photosCheck"> Кожен знайшов 5 фото партнера й ви відкрили категорії одночасно</label>
      <div id="treatClue" class="card hint" style="${state.hamsterTreat?'display:block':''}">${esc(s.hamsterTreatClue||'')}</div>
    </div>`;
  }
  if(s.completionType==='final'){
    body+=`<div class="card riddle">${esc(s.finalNote||'')}</div><div class="finalExport"><strong>Фото з усієї подорожі</strong><div class="small">Усі фото, які ви завантажували під час квесту, можна забрати одним ZIP-архівом.</div><button class="btn primary" id="exportBtn" style="margin-top:9px">Вивантажити всі фото</button></div>`;
  }

  const actions=[];
  if(s.completionType==='button') actions.push({label:s.completeLabel||'Завершити етап',kind:'primary',onClick:()=>completeStage(i)});
  if(s.completionType==='ready_gate') actions.push({label:s.completeLabel||'Готово',kind:'primary',onClick:()=>completeStage(i)});
  if(s.completionType==='photo'||s.completionType==='photo_caption') actions.push({label:s.completeLabel||'Завершити',kind:'primary',disabled:true,onClick:()=>completeStage(i)});
  if(s.completionType==='phrase') actions.push({label:s.completeLabel||'Перевірити',kind:'primary',onClick:()=>checkPhrase(i)});
  if(s.completionType==='hamster'){
    if(!state.hamsterTreat) actions.push({label:'Відкрити, де ласощі',kind:'primary',onClick:()=>unlockTreats(i)});
    else actions.push({label:'Хранителя задобрено — далі',kind:'primary',onClick:()=>completeStage(i)});
  }
  actions.push({label:'Назад до карти',onClick:closeSheet});
  openSheet(s.title,`Етап ${s.number} з ${STEPS.length}`,body,actions);

  if(s.completionType==='photo'||s.completionType==='photo_caption'){
    document.getElementById('photoInput').addEventListener('change',async e=>{
      for(const file of [...e.target.files]) await savePhoto(i,file,'');
      await renderPhotoGrid(i,s.completionType==='photo_caption');
    });
    await renderPhotoGrid(i,s.completionType==='photo_caption');
  }
  if(s.completionType==='hamster'){
    const refresh=()=>{const ok=document.getElementById('hutCheck').checked&&document.getElementById('photosCheck').checked;const primary=[...sheetActions.querySelectorAll('.btn.primary')][0];if(primary)primary.disabled=!ok};
    document.getElementById('hutCheck').onchange=refresh;document.getElementById('photosCheck').onchange=refresh;refresh();
  }
  if(s.completionType==='final') document.getElementById('exportBtn').onclick=exportPhotos;
}

function completeStage(i){
  if(!state.completed.includes(i))state.completed.push(i);
  state.phase='completed';
  save();
  closeSheet();
  renderMap();
  centerOnCurrent(true);
}
function advanceAfterCompletion(){
  state.phase='riddle';
  save();
  renderMap();
  openRiddle();
}
function openRiddle(){
  const s=STEPS[state.step],next=STEPS[state.step+1];
  if(!next){openStage(state.step);return}
  const hintShown=!!state.hintShown[s.id];
  let body=`<div class="card riddle">${esc(s.riddle||'')}</div>
  <div id="hintCard" class="card hint" style="${hintShown?'display:block':''}"><strong>Де шукати фізичну підказку:</strong>\n${esc(s.hintLocator||'')}</div>`;
  let actions=[];
  if(!hintShown) actions.push({label:'Потрібна підказка',onClick:()=>{state.hintShown[s.id]=true;save();openRiddle()}});
  if(next.unlockMode==='manual'){
    actions.push({label:s.nextActionLabel||'Ми знайшли місце',kind:'primary',onClick:()=>unlockNext(next.id)});
  }else if(next.unlockMode==='qr'){
    if(CFG.testMode) actions.push({label:'🧪 Імітувати сканування QR',kind:'test',onClick:()=>unlockNext(next.id)});
    actions.push({label:'Закрити й шукати QR',kind:'dark',onClick:closeSheet});
  }
  actions.push({label:'Назад до карти',onClick:closeSheet});
  openSheet('Куди далі?','Загадка маршруту',body,actions);
}
function unlockNext(id){
  const idx=STEPS.findIndex(x=>x.id===id);if(idx<0)return;
  state.step=idx;state.phase='stage';save();closeSheet();renderMap();centerOnCurrent(true);setTimeout(()=>openStage(idx),480);
}
function checkPhrase(i){
  const input=document.getElementById('phraseInput').value;
  const target=CFG.finalPhrase||'';
  if(normalize(input)===normalize(target)){completeStage(i)}
  else document.getElementById('phraseErr').style.display='block';
}
function unlockTreats(i){
  const a=document.getElementById('hutCheck'),b=document.getElementById('photosCheck');
  if(!a.checked||!b.checked)return;
  state.hamsterTreat=true;save();openStage(i);
}

// QR deep-link: ?unlock=chess etc.
function processDeepLink(){
  const id=new URLSearchParams(location.search).get('unlock');
  if(!id)return;
  const idx=STEPS.findIndex(x=>x.id===id);
  if(idx===state.step+1 && state.phase==='riddle' && STEPS[idx].unlockMode==='qr'){
    unlockNext(id);
    history.replaceState({},'',location.pathname);
  }
}

// ---------- Photo storage ----------
const DB='anniversaryQuestPhotosV2',STORE='photos';
function openDB(){return new Promise((res,rej)=>{if(!indexedDB)return rej();const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function savePhoto(stepIndex,file,caption){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add({stepIndex,blob:file,name:file.name,type:file.type,caption,createdAt:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function allPhotos(){try{const db=await openDB();return await new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}catch(e){return[]}}
async function updatePhoto(id,patch){const db=await openDB();const all=await allPhotos();const p=all.find(x=>x.id===id);if(!p)return;Object.assign(p,patch);return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(p);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function deletePhoto(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function clearPhotos(){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function renderPhotoGrid(i,captionRequired){
  const grid=document.getElementById('photoGrid');if(!grid)return;
  const arr=(await allPhotos()).filter(p=>p.stepIndex===i);grid.innerHTML='';
  for(const p of arr){
    const d=document.createElement('div');d.className='photoItem';const url=URL.createObjectURL(p.blob);
    d.innerHTML=`<img src="${url}">${captionRequired?`<input data-id="${p.id}" value="${esc(p.caption||'')}" placeholder="Назва страви">`:''}<button class="btn" data-del="${p.id}" style="width:100%;margin-top:6px;padding:7px">Видалити</button>`;
    grid.appendChild(d);
  }
  grid.querySelectorAll('input[data-id]').forEach(inp=>inp.oninput=async()=>{await updatePhoto(+inp.dataset.id,{caption:inp.value});await gatePhoto(i,captionRequired)});
  grid.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async()=>{await deletePhoto(+btn.dataset.del);await renderPhotoGrid(i,captionRequired)});
  await gatePhoto(i,captionRequired);
}
async function gatePhoto(i,captionRequired){
  const arr=(await allPhotos()).filter(p=>p.stepIndex===i);
  const ok=arr.length>0 && (!captionRequired || arr.every(p=>(p.caption||'').trim()));
  const primary=[...sheetActions.querySelectorAll('.btn.primary')][0];if(primary)primary.disabled=!ok;
}
async function exportPhotos(){
  const arr=await allPhotos();if(!arr.length){alert('Ще немає фото для вивантаження.');return}
  if(typeof JSZip==='undefined'){alert('Не вдалося завантажити модуль ZIP. Спробуйте ще раз при підключеному інтернеті.');return}
  const zip=new JSZip(),folder=zip.folder('photos'),manifest=[];
  const counters={};
  arr.sort((a,b)=>a.createdAt-b.createdAt).forEach(p=>{
    counters[p.stepIndex]=(counters[p.stepIndex]||0)+1;
    const s=STEPS[p.stepIndex]||{id:'step',title:'Етап'};
    const ext=(p.type||'').includes('png')?'png':(p.type||'').includes('heic')?'heic':'jpg';
    const name=`${String(p.stepIndex+1).padStart(2,'0')}_${s.id}_${String(counters[p.stepIndex]).padStart(2,'0')}.${ext}`;
    folder.file(name,p.blob);manifest.push(`${s.title}: ${name}${p.caption?' — '+p.caption:''}`);
  });
  zip.file('Фото_та_назви.txt',manifest.join('\n'));
  const blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download=(CFG.zipName||'anniversary-quest-photos')+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}

layout(true);renderMap();processDeepLink();
setTimeout(()=>{if(state.step===0&&state.phase==='stage')openStage(0)},450);
</script>
