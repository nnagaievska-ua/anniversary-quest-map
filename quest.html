<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мапа Таємних Територій Дому</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6bd8f;font-family:Georgia,"Times New Roman",serif}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#d6bd8f}
  #canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #map{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .hot{position:absolute;transform:translate(-50%,-50%);border:0;background:rgba(255,222,130,.025);cursor:pointer;z-index:5;outline:none;animation:pulse 1.55s ease-in-out infinite}
  .hot:before{content:"";position:absolute;inset:-8%;border-radius:inherit;box-shadow:0 0 0 1px rgba(255,249,220,.65),0 0 16px 7px rgba(255,196,52,.68),0 0 38px 18px rgba(255,175,0,.22)}
  .hot:after{content:"";position:absolute;inset:-1%;border-radius:inherit;background:radial-gradient(circle,rgba(255,241,165,.18),rgba(255,211,62,.05) 52%,transparent 78%)}
  @keyframes pulse{0%,100%{opacity:.82;filter:brightness(1)}50%{opacity:1;filter:brightness(1.32)}}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:#51391d;font-size:16px;background:#d6bd8f;z-index:3}
  .modalbg{position:fixed;inset:0;background:rgba(17,11,6,.68);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modalbg.open{display:flex}
  .modal{width:min(690px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#fbf1d6,#efdcad);color:#3e2a17;border:1px solid rgba(94,62,28,.4);border-radius:22px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.48)}
  .head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
  h2{margin:0 0 12px;font-size:clamp(23px,6vw,34px)}
  .close{border:0;background:#ead6a8;color:#4d351d;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
  .card{background:rgba(255,255,255,.34);border:1px solid rgba(94,62,28,.13);border-radius:15px;padding:13px;margin-top:11px;line-height:1.52;font-size:16px}
  .upload{margin-top:13px;padding:12px;border:1px dashed rgba(94,62,28,.3);border-radius:14px;background:rgba(255,255,255,.22)}
  .upload input{width:100%;margin-top:8px}
  .preview{display:none;margin-top:9px}
  .preview img{max-width:100%;max-height:220px;border-radius:12px}
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
  .btn{border:0;border-radius:13px;padding:12px 15px;font:700 15px Georgia,serif;cursor:pointer}
  .primary{background:#d9a53e;color:#2c1b08}.secondary{background:#e4d1a8;color:#4d351d}.primary:disabled{opacity:.45;cursor:not-allowed}
  .final{display:none;margin-top:13px;padding:13px;border-radius:14px;background:#efe0b3;border:1px solid #d2a84e;line-height:1.55}
  @media(max-width:700px){.modal{padding:15px;border-radius:18px}}
</style>
</head>
<body>
<div id="stage"><div id="canvas"><img id="map" alt="Мапа Таємних Територій Дому"></div><div class="loading" id="loading">Відкриваємо карту…</div></div>
<div class="modalbg" id="mb"><div class="modal"><div class="head"><h2 id="title"></h2><button class="close" id="x">×</button></div><div class="card" id="text"></div><div class="card"><strong>Завдання</strong><div id="task" style="margin-top:6px"></div></div><div class="upload" id="up"><strong>Фото-підтвердження</strong><div style="font-size:12px;color:#76644c;margin-top:4px">Завантажте фото, щоб відкрити наступну точку.</div><input id="photo" type="file" accept="image/*" capture="environment"><div class="preview" id="prev"><img id="previmg" alt=""></div></div><div class="final" id="fin">Ми обійшли весь світ, хоча так і не вийшли з квартири. Але найважливіше місце на цій карті — там, де ми обоє.</div><div class="actions"><button class="btn primary" id="go"></button><button class="btn secondary" id="back">Назад до мапи</button></div></div></div>
<script>
const steps=[
 {title:'Брама Першого Ключа',x:81.6,y:33.8,w:5.2,h:7.0,r:50,photo:false,text:'Сьогодні звичайна квартира перетворюється на маршрут. Карта не відкриється вся одразу — наступні місця з’являтимуться лише після проходження попередніх.',task:'Знайдіть ключі біля входу. Саме QR-код на них привів вас сюди. Коли готові почати — відкрийте наступну точку.'},
 {title:'Осередок Теплого Вогню',x:71.9,y:65.5,w:16,h:27,r:32,photo:true,text:'Місце спільних запахів, вечерь, сніданків і домашнього тепла.',task:'Витягніть страву та випадкові правила/заборони. Приготуйте її, придумайте тематичну назву й зробіть фото результату.'},
 {title:'Поле Гросмейстерської Битви',x:44.5,y:71.7,w:15,h:14,r:30,photo:true,text:'У Великій Залі починається перша дуель.',task:'Зіграйте звичайну партію в шахи. Кожен таємно позначає 3 заміновані клітинки. Якщо суперник стає на вашу міну — тягне штрафне завдання. Переможець отримує перевагу в наступній грі.'},
 {title:'Швидкі питання',x:47.2,y:58.8,w:15,h:13,r:34,photo:true,text:'Тут важлива не пам’ять на дати, а швидкість реакції.',task:'Кожен придумує свої питання. Поки один відповідає — другий закреслює клітинки. Переможець шахів може додатково домальовувати клітинки супернику, якщо встигає.'},
 {title:'Бібліотека Шифрів',x:58.1,y:67.8,w:6.8,h:23,r:24,photo:true,text:'Деякі відповіді не лежать на поверхні. Вони ховаються між сторінками.',task:'Ідіть від книги до книги за підказками. Зберіть перемішані слова й складіть фразу: «І серед усіх цих сторінок наша історія — найкраща. По-перше, тому що вона наша. А по-друге — тому що вона ще тільки починається.» Сфотографуйте готову фразу.'},
 {title:'Майдан Рухомих Тіней',x:49.0,y:53.3,w:20,h:18,r:40,photo:true,text:'Після головоломок час трохи розім’ятися.',task:'Музика грає — ви танцюєте. На паузі треба якнайшвидше сісти на стілець. Хто не встиг — тягне нове правило. Усі попередні правила залишаються чинними.'},
 {title:'Територія Малого Хранителя',x:26.0,y:65.5,w:19,h:25,r:34,photo:true,text:'Шлях охороняє найменший господар дому. Для нього ви поки надто великі й підозрілі.',task:'Разом побудуйте одну хом’ячу халабуду, залізьте всередину й зробіть фото. Потім знайдіть у телефонах по одному фото партнера в категоріях: милий, смішний, привабливий, красивий, улюблений. Після цього подякуйте Хранителю його улюбленими ласощами.'},
 {title:'Стоянка Двоколісних Мандрів',x:57.4,y:48.0,w:8.5,h:13,r:34,photo:true,text:'Сьогодні велосипеди потрібні не для їзди, а для гри.',task:'Один тягне картку з велосипедною ситуацією та трьома забороненими словами. Треба пояснити ситуацію, не називаючи її прямо, а другий відгадує.'},
 {title:'Водяна Палата Хибних Відповідей',x:23.7,y:37.8,w:12,h:16,r:34,photo:true,text:'У цій кімнаті правда карається водою.',task:'Ставте швидкі очевидні питання. Відповідати треба неправильно, але по змісту. Правильна відповідь або довга пауза — водяний штраф із пульверизатора. Не бризкайте в очі чи обличчя.'},
 {title:'Остання Гавань Маршруту',x:27.6,y:15.7,w:18,h:18,r:34,photo:false,text:'Після всіх дивних правил, перемог, поразок і пригод маршрут стає тихішим.',task:'Напишіть «Капсулу на наступні 5 років». Потім — по 5 речей, за які ви обираєте одне одного. Після цього відкривається фінальна записка, подарунок і повільний танець.'}
];
const KEY='annivQuestGlow_v2';let state=JSON.parse(localStorage.getItem(KEY)||'{"i":0}');if(!Number.isInteger(state.i)||state.i<0||state.i>=steps.length)state.i=0;let temp=null;
const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),map=document.getElementById('map'),loading=document.getElementById('loading'),mb=document.getElementById('mb'),title=document.getElementById('title'),text=document.getElementById('text'),task=document.getElementById('task'),up=document.getElementById('up'),photo=document.getElementById('photo'),prev=document.getElementById('prev'),previmg=document.getElementById('previmg'),go=document.getElementById('go'),fin=document.getElementById('fin');
function fit(){const ratio=1672/941,w=innerWidth,h=innerHeight;if(w/h>ratio){canvas.style.height=h+'px';canvas.style.width=(h*ratio)+'px'}else{canvas.style.width=w+'px';canvas.style.height=(w/ratio)+'px'}}
addEventListener('resize',fit);fit();
async function loadMap(){try{const html=await fetch('/index.html',{cache:'force-cache'}).then(r=>r.text());const m=html.match(/data:image\/png;base64,[A-Za-z0-9+/=]+/);if(!m)throw new Error('image not found');map.src=m[0];map.onload=()=>{loading.style.display='none';render()}}catch(e){loading.textContent='Не вдалося відкрити карту';console.error(e)}}
function render(){canvas.querySelectorAll('.hot').forEach(e=>e.remove());const s=steps[state.i];const b=document.createElement('button');b.className='hot';b.style.left=s.x+'%';b.style.top=s.y+'%';b.style.width=s.w+'%';b.style.height=s.h+'%';b.style.borderRadius=s.r+'%';b.setAttribute('aria-label',s.title);b.onclick=open;canvas.appendChild(b)}
function open(){const s=steps[state.i];temp=null;photo.value='';prev.style.display='none';title.textContent=s.title;text.textContent=s.text;task.textContent=s.task;up.style.display=s.photo?'block':'none';fin.style.display=state.i===steps.length-1?'block':'none';go.disabled=!!s.photo;go.textContent=state.i===0?'Почати маршрут':state.i===steps.length-1?'Завершити маршрут':'Виконано — відкрити далі';mb.classList.add('open')}
photo.onchange=()=>{const f=photo.files&&photo.files[0];if(!f)return;temp=f;const r=new FileReader();r.onload=()=>{previmg.src=r.result;prev.style.display='block';go.disabled=false};r.readAsDataURL(f)};
go.onclick=()=>{const s=steps[state.i];if(s.photo&&!temp)return;if(state.i<steps.length-1){state.i++;localStorage.setItem(KEY,JSON.stringify(state));mb.classList.remove('open');render()}else{localStorage.setItem(KEY,JSON.stringify(state));mb.classList.remove('open');alert('Маршрут завершено 💛')}};
document.getElementById('x').onclick=()=>mb.classList.remove('open');document.getElementById('back').onclick=()=>mb.classList.remove('open');mb.onclick=e=>{if(e.target===mb)mb.classList.remove('open')};
loadMap();
</script>
</body></html>
